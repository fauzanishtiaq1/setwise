name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m setwise --help
      - name: Reproduce the 30-seed benchmark
        run: python benchmarks/run.py --output benchmarks/ci-results.json
